name: Demo PR autopilot (label + auto-ready)

# For automated demo PRs opened by the Copilot coding agent this workflow:
#   1. stamps the `automated-demo` label (when a linked/closing issue is a `demo-candidate`),
#   2. once the agent has FINISHED building (its most recent `copilot_work_*` timeline event is
#      `copilot_work_finished`), marks the draft PR ready for review — so Copilot code review
#      kicks off automatically, with no manual "Ready for review" click, and
#   3. hands the ready PR off to the maintainer by assigning `edinc` (GitHub then notifies them of
#      PR activity, including when Copilot code review posts its findings). There is no automated
#      fix loop: Copilot code review runs, then a human reviews and merges (or re-runs the agent).
#
# This runs as an ordinary `pull_request` workflow. With the repo's Copilot policy
# "Require approval for workflow runs" disabled, the coding agent's own pushes trigger it
# automatically (agent pushes are treated as "Copilot pushes", not "automation" pushes).

on:
  pull_request:
    # `synchronize` (each agent push) plus the timeline poll below are the workhorse — the agent's
    # final push reliably drives completion. `review_requested` (fired when Copilot review is
    # requested around completion) is an extra fast-path trigger; the rest catch earlier states.
    types: [opened, reopened, edited, synchronize, review_requested]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  # One run at a time per PR, but DO NOT cancel in-progress runs: the un-draft step may be
  # polling for the agent's `copilot_work_finished` event and must be allowed to complete.
  group: demo-autopilot-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    # Skip fork PRs: they get a read-only token, so writes would 403.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Label demo PRs and mark them ready once the agent has finished
        env:
          # `gh pr ready` (markPullRequestReadyForReview) is NOT permitted to the Actions
          # GITHUB_TOKEN — it returns "Resource not accessible by integration". Use the user
          # PAT (the same secret the scout uses to delegate to the agent), which can un-draft;
          # fall back to GITHUB_TOKEN so labeling still works if the PAT is absent.
          GH_TOKEN: ${{ secrets.GH_AW_AGENT_TOKEN || secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          R="$OWNER/$REPO"

          # --- Scope: only the Copilot coding agent's PRs -------------------------------------
          # The webhook actor login for the agent isn't stable across surfaces, so resolve the
          # author via the API and match loosely rather than gating in `if:` (which would fail
          # silently on a mismatch).
          author=$(gh pr view "$PR_NUMBER" -R "$R" --json author --jq '.author.login' 2>/dev/null || echo "")
          echo "PR #$PR_NUMBER author: ${author:-<unknown>}"
          case "$(printf '%s' "$author" | tr '[:upper:]' '[:lower:]')" in
            *copilot*|*swe-agent*) : ;;
            *) echo "Not a coding-agent PR — nothing to do."; exit 0 ;;
          esac

          # --- 1. Label: automated-demo when a linked/closing issue is a demo-candidate -------
          linked=$(gh api graphql \
            -f query='
              query($owner:String!, $repo:String!, $pr:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$pr) {
                    closingIssuesReferences(first:20) {
                      nodes { labels(first:20) { nodes { name } } }
                    }
                  }
                }
              }' \
            -F owner="$OWNER" -F repo="$REPO" -F pr="$PR_NUMBER" \
            --jq '[.data.repository.pullRequest.closingIssuesReferences.nodes[].labels.nodes[].name] | unique' 2>/dev/null || echo '[]')
          echo "Linked issue labels: ${linked:-[]}"

          is_demo=false
          if printf '%s' "$linked" | grep -q '"demo-candidate"'; then
            is_demo=true
          fi

          # Fallback: an agent PR that touches demo-site/** is a demo even if the issue link
          # isn't resolvable yet (e.g. the PR body's `Fixes #N` hasn't been indexed).
          if [ "$is_demo" != "true" ] \
             && gh pr view "$PR_NUMBER" -R "$R" --json files --jq '.files[].path' 2>/dev/null \
                  | grep -q '^demo-site/'; then
            is_demo=true
          fi

          # Label any detected demo PR — via EITHER detection path above.
          if [ "$is_demo" = "true" ]; then
            gh label create automated-demo -R "$R" \
              --color 5319e7 --description "Auto-generated Copilot feature demo" \
              --force >/dev/null 2>&1 || true
            gh pr edit "$PR_NUMBER" -R "$R" --add-label automated-demo || true
            echo "Labeled PR #$PR_NUMBER as automated-demo."
          fi

          # --- 2. Mark ready once the agent is done ------------------------------------------
          is_draft=$(gh pr view "$PR_NUMBER" -R "$R" --json isDraft --jq '.isDraft' 2>/dev/null || echo "false")
          if [ "$is_demo" != "true" ] || [ "$is_draft" != "true" ]; then
            echo "Nothing to un-draft (is_demo=$is_demo, is_draft=$is_draft)."
            exit 0
          fi

          # The agent records `copilot_work_started` / `copilot_work_finished` on the PR
          # timeline. Un-drafting mid-build would trigger a premature review, so wait until the
          # newest such event is `copilot_work_finished`. Poll briefly to absorb the few seconds
          # by which the event can lag the push/rename that triggered this run.
          latest_work_event() {
            gh api "repos/$R/issues/$PR_NUMBER/timeline" --paginate \
              -H "Accept: application/vnd.github+json" \
              --jq '[.[] | select(.event|startswith("copilot_work"))] | sort_by(.created_at) | last | .event // ""' 2>/dev/null
          }
          finished=""
          for i in $(seq 1 9); do
            ev="$(latest_work_event)"
            echo "poll $i/9: latest copilot_work event = '${ev:-<none>}'"
            if [ "$ev" = "copilot_work_finished" ]; then finished=1; break; fi
            sleep 10
          done

          if [ "${finished:-}" = "1" ]; then
            if gh pr ready "$PR_NUMBER" -R "$R"; then
              echo "Marked PR #$PR_NUMBER ready for review."
              # Hand off to the maintainer by assigning edinc. GitHub then notifies edinc of PR
              # activity — including when Copilot code review posts its findings — so no separate
              # hand-off comment is needed (reacting to the review event itself would be gated).
              gh pr edit "$PR_NUMBER" -R "$R" --add-assignee edinc || true
            else
              echo "gh pr ready returned non-zero (already ready?) — continuing."
            fi
          else
            echo "Agent not finished yet (no copilot_work_finished). A later event will retry."
          fi
